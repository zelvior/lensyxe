# Release pipeline for Lensyxe.
#
# Triggered by pushing a `v*` tag. The tag is the release: nothing here
# rewrites versions, and nothing publishes without one.
#
# The order of the steps is load-bearing. The dashboard must be built before
# Go, because the Go binary embeds it; and Go must be verified before goreleaser
# publishes, because a release is not a place to discover that the tree does not
# build.
name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run from the Actions tab produces a snapshot build and uploads it
  # as a draft, which is how the cross-compilation matrix is tested before a
  # real tag goes out.
  workflow_dispatch:

permissions:
  # The release needs to write releases and, for the provenance attestation, to
  # publish to the transparency log. Nothing else.
  contents: write
  id-token: write
  attestations: write

# A superseded tag should not fight with the release it replaced.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ verify
  # Runs on every push and every manual dispatch. A tag that fails here never
  # reaches the publish job, so a broken release cannot exist even briefly.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the changelog is generated from commits, and a
          # shallow clone would produce a release note covering one commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The floor, deliberately, because this job verifies the tree rather
          # than producing anything a user downloads. If 1.22 can no longer build
          # the project, the README's stated requirement is wrong and this is
          # where that should be caught.
          #
          # The build job below uses a newer toolchain because macOS 26 requires
          # an LC_UUID load command that Go only emits by default from 1.24.
          go-version: '1.22'
          # The module cache survives between runs; the build cache does not
          # need to, since Go's own cache misses are cheap relative to a compile.
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^dashboard/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # `go mod tidy` then `git diff --exit-code`, NOT `go mod tidy -diff`.
      #
      # -diff was added in Go 1.23 and this job pins 1.22, the floor, where the
      # flag is rejected and the command exits 2 before tidiness is checked. That
      # is how the very first tagged release died in nineteen seconds, in the
      # verify job, before a single binary was built.
      - name: Check module files are tidy
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy' and commit the result"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo and a C toolchain. Both are present on the
      # ubuntu runner; without them this step would silently skip the only test
      # capable of finding a data race.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        env:
          CGO_ENABLED: '1'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # ------------------------------------------------------------------- build
  # Produces the dashboard export and the cross-compiled binaries.
  build:
    name: Build and release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # This is the job that produces the binaries users download, so it is
          # the one that has to be new enough to emit LC_UUID. macOS 26's dyld
          # will not load a Mach-O executable without it, and Go only started
          # emitting one by default in 1.24. Built with 1.22, every darwin
          # archive in this release would build cleanly and then abort the
          # instant someone ran it. See golang/go#68678.
          #
          # go.mod still declares `go 1.22`; that is the language version and the
          # contributor floor, and CI's test matrix keeps proving 1.22 works.
          go-version: '1.24'
          cache-dependency-path: go.sum

      # ---------------------------------------------------------- dashboard
      # The dashboard is a Next.js static export copied into internal/server/
      # assets before the Go build, which is what embeds it. The copy happens
      # in goreleaser's before-hook too; doing it here as well means the Go
      # build goreleaser invokes already has the assets in place, and the copy
      # step is visible in this job's log rather than buried in a hook.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: Type-check the dashboard
        working-directory: dashboard
        run: npm run typecheck

      - name: Build the dashboard
        working-directory: dashboard
        run: npm run build

      - name: Copy the export into the embed directory
        shell: bash
        run: |
          set -euo pipefail
          target="internal/server/assets"

          # Clear the previous export, but never the whole directory.
          #
          # `rm -rf "$target"` deletes .gitkeep, which is tracked precisely so
          # that `//go:embed all:assets` has something to embed on a clean
          # checkout. Deleting it leaves the working tree dirty, and goreleaser
          # refuses to release from a dirty tree -- which is how the first tagged
          # release failed in the build job with no clue why, nineteen seconds
          # after the dashboard had built perfectly.
          #
          # Removing only real files leaves the tracked placeholder alone.
          find "$target" -type f ! -name '.gitkeep' -delete 2>/dev/null || true
          find "$target" -mindepth 1 -type d -empty -delete 2>/dev/null || true
          mkdir -p "$target"

          cp -r dashboard/out/. "$target"/
          count="$(find "$target" -type f | wc -l)"
          echo "embedded $count dashboard files"
          if [ "$count" -lt 5 ]; then
            echo "::error::the dashboard export looks incomplete ($count files)"
            exit 1
          fi

          # Report a dirty tree here, where the reason is legible, rather than
          # leaving goreleaser to fail with a bare "git is in a dirty state".
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the tree is dirty after embedding the dashboard:"
            git status --porcelain
            exit 1
          fi

      # ------------------------------------------------------------ verify
      # Proving the binary contains the dashboard before publishing is much
      # cheaper than shipping one that serves a blank page.
      - name: Build and inspect a native binary
        shell: bash
        run: |
          set -euo pipefail
          go build -ldflags "-X main.BuiltBy=ci-verify" -o /tmp/lensyxe ./cmd/lensyxe
          /tmp/lensyxe version

          # The embedded index must exist in the linked binary.
          if ! strings /tmp/lensyxe | grep -q 'lensyxe:engineering-impact'; then
            echo "::error::the dashboard is not present in the linked binary"
            exit 1
          fi

          # The API must answer without a dashboard, too: a release that cannot
          # start is worse than one that cannot render.
          ( /tmp/lensyxe serve --port 17357 --no-analyze >/tmp/serve.log 2>&1 & echo $! >/tmp/serve.pid )
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17357/api/v1/version >/tmp/version.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat /tmp/version.json || true
          kill "$(cat /tmp/serve.pid)" 2>/dev/null || true

      # ------------------------------------------------------ editor extension
      #
      # The VSIX is published alongside the binaries so a user never has to have
      # Node, npm, or a Go toolchain installed to get the editor experience.
      #
      # It is built after the dashboard rather than before it: the extension
      # shells out to the lensyxe binary and never touches the dashboard, so
      # there is no ordering dependency. It is a single artifact regardless of
      # platform, because a VS Code extension is JavaScript and the same package
      # serves every OS.
      - name: Set up Node for the extension
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Build and package the extension
        working-directory: ide/vscode
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run compile
          # Regenerate and require it to match what is committed, so the icon
          # cannot drift from its generator between releases.
          #
          # The paths are repo-root relative on purpose. This step runs with
          # working-directory ide/vscode, and a git diff against a
          # subdirectory-relative path silently compares the committed icon with
          # itself -- which is how the first release attempt "passed" this check
          # while the generator was writing somewhere else entirely.
          npm run icon
          if ! git diff --exit-code -- ide/vscode/media/icon.png; then
            echo "::error::ide/vscode/media/icon.png does not match its generator"
            exit 1
          fi
          npm run package

      - name: Check the packaged extension
        # Run from the repository root: the validator resolves
        # ide/vscode/package.json relative to the working directory, so invoking
        # it from inside ide/vscode would report the manifest as missing.
        run: go run ide/vscode/scripts/check-manifest-docs.go

      # ------------------------------------------------------------ release
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned to a release rather than a floating tag: the release pipeline
          # building the release tool is exactly where an unpinned dependency
          # hurts most.
          version: '~> v2'
          distribution: goreleaser
          args: release --clean
        env:
          # Required for the provenance attestation to be signed without a
          # long-lived key.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish a snapshot as a draft
        # A manual run has no tag, so there is nothing to release to. The
        # artifacts are uploaded to a draft release so the matrix can be
        # inspected before a real tag goes out.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          prerelease: true
          name: snapshot-${{ github.sha }}
          body: |
            Snapshot build of `${{ github.sha }}`.

            Produced by a manual workflow run; no tag was pushed. Every
            cross-compiled target was built and checksummed, but this release is
            not a published version.

      - name: Upload archives as a workflow artifact
        # A copy that outlives the draft release, so a failed publish is still
        # recoverable from the Actions tab.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14