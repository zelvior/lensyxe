# Release configuration for Lensyxe.
#
# The pipeline is deliberately small: prepare, cross-compile, archive,
# checksum, publish. Anything larger would be machinery with no user behind it.
#
# The dashboard is embedded in every binary, so scripts/prepare-release.sh must
# run before the Go build; it copies the static export into the directory
# //go:embed reads and refuses to continue if the tree is untidy, unformatted,
# or fails vet. A release that rewrites its own source would mean the tag
# describes something other than the code that produced it.
#
# Locally:  goreleaser release --snapshot --clean
version: 2

project_name: lensyxe

# ---------------------------------------------------------------- before hooks
#
# Hooks are plain command strings: goreleaser runs each through the system
# shell. Anything longer than one line lives in the script, because a hook that
# cannot express a conditional or an exit code is not a verification step.

before:
  hooks:
    - bash scripts/prepare-release.sh

# -------------------------------------------------------------------- build

builds:
  - id: lensyxe
    main: ./cmd/lensyxe
    binary: lensyxe
    # Pure Go with no cgo. modernc.org/sqlite was chosen over mattn/go-sqlite3
    # specifically so cross-compiling to darwin/arm64 and linux/arm64 needs no C
    # toolchain on the runner. CGO_ENABLED=0 is therefore a hard requirement of
    # this matrix rather than a size optimization.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # -trimpath removes local filesystem paths from the binary, which is what
    # makes two builds of the same commit byte-identical and therefore
    # comparable against a published checksum.
    flags:
      - -trimpath
    # -s -w strips the symbol table and DWARF data. Neither is useful in a
    # shipped binary and together they remove roughly a third of its size.
    #
    # The -X symbols must match cmd/lensyxe/version.go exactly: the linker
    # resolves them by name and silently does nothing when they do not match, so
    # a release could report "dev" while claiming to be v1.0.0. The names are
    # verified by scripts/prepare-release.sh rather than trusted.
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
      - -X main.Commit={{ .Commit }}
      - -X main.Date={{ .Date }}
      - -X main.BuiltBy=goreleaser

  # The setup wizard, shipped as its own binary so an installer can offer a guided
  # install without lensyxe itself growing a dependency on a terminal UI.
  #
  # It is deliberately a console program. A windowed setup flow needs a webview or
  # an OpenGL toolkit, either of which requires cgo and a native toolchain on every
  # platform above, and would break the CGO_ENABLED=0 matrix that makes
  # single-runner cross-compilation possible at all.
  - id: lensyxe-gui
    main: ./cmd/lensyxe-gui
    binary: lensyxe-gui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

# ------------------------------------------------------------------ archives

archives:
  - id: lensyxe
    # tar.gz everywhere except Windows, which gets a zip: a zip is the only
    # archive a Windows user can open without installing anything first.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The name mirrors `uname` conventions so a Linux user can recognize
    # x86_64 and an arm64 host without looking it up.
    # One line, on purpose.
    #
    # This was a YAML folded block, where a newline between two template actions
    # folds into a literal space. Go templates emit that space, so the published
    # archives were named "lensyxe_ 1.0.0-rc1_Darwin_arm64.tar.gz" with a space
    # after the first underscore, while install.sh builds the name without one.
    # Every install would have 404'd on a filename that looked entirely correct.
    #
    # A folded block cannot express "no whitespace here" reliably; a single
    # quoted line cannot accidentally grow one. TestInstallerMatchesRelease-
    # ArtifactNames renders this template and fails on any whitespace, so the
    # mistake cannot come back unnoticed.
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    # The files travel with the binary so an archive is self-describing: a user
    # who unpacks it can read what the tool is and what the license is without
    # going back to the repository.
    files:
      - README.md
      - LICENSE
      - .lensyxe.yml
      - src: action/action.yml
        dst: lensyxe-action.yml

# ------------------------------------------------------------------ checksum

checksum:
  name_template: checksums.txt
  # One combined file rather than per-artifact sidecars: verifying a download
  # should not require locating a second file that might not have arrived.
  algorithm: sha256

# ------------------------------------------------------------------ snapshot

snapshot:
  # A snapshot must never collide with a real version string, or a draft build
  # could be mistaken for the release it was testing.
  version_template: "{{ incpatch .Version }}-snapshot"

# ------------------------------------------------------------------- release

release:
  prerelease: auto
  draft: false
  replace_existing_draft: true
  # Fill a release the workflow created before goreleaser started.
  #
  # Creating the release and immediately uploading to it is a race: GitHub's
  # uploads endpoint returned 404 Not Found for a release goreleaser had just
  # created, which aborted the publish after all six binaries had been built and
  # archived. Pre-creating the draft and pointing goreleaser at it removes the
  # window entirely, because the release already exists by the time the first
  # upload is attempted.
  use_existing_draft: true
  # Tolerate a release that already carries assets.
  #
  # A draft release left behind by an earlier failed run is invisible to the
  # public releases API, so a retry after a partial failure finds assets already
  # present and every upload fails with 422 already_exists. Replacing them in
  # place makes the release reproducible: the same tag always ends up with the
  # same artifacts, whether or not a previous attempt got partway.
  replace_existing_artifacts: true
  # The action spec ships alongside the binaries so a consumer can pin the
  # Action to the release they downloaded rather than tracking a moving ref.
  # Each entry is a glob only: goreleaser's extra_files has no rename field, so
  # the destination keeps its source name.
  extra_files:
    # checksums.txt is deliberately absent. goreleaser already publishes the
    # checksum file as an artifact of the checksum section, so listing it here as
    # well queued the same name twice, and the duplicate upload is what failed.
    - glob: action/action.yml
    # The editor extension, so a VS Code user downloads a finished package rather
    # than needing Node, npm, and a Go toolchain to build one. Built by the
    # release workflow immediately before this step, so a broken extension build
    # fails the release instead of shipping an absent artifact.
    #
    # A VSIX is platform-independent: the extension is JavaScript and shells out
    # to the separately published binary, so one file serves every OS.
    - glob: ide/vscode/*.vsix
  footer: |
    ## Verifying a download

    Every release includes a `checksums.txt` with the SHA-256 of each artifact.
    Verify before running anything:

    ```
    sha256sum -c checksums.txt
    ```

    Lensyxe is local-first: analysis makes no outbound request and the tool has
    no telemetry. If a binary you downloaded does anything else, it is not
    Lensyxe.

    ## Provenance

    Each binary was cross-compiled by the release workflow in this repository.
    `lensyxe version` prints the commit, the build date, and the Go toolchain
    it was produced with, so a downloaded binary can be traced to its source.

# ----------------------------------------------------------------- changelog

changelog:
  sort: asc
  filters:
    exclude:
      # Changelog noise: these commits do not change what a user sees or does.
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^Merge pull request"
      - "^Merge branch"
      - "typo"

# ------------------------------------------------------------------- metadata

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

# ------------------------------------------------------------------ desktop
#
# Native installers sit alongside the archives rather than replacing them. The
# archives remain the path of least resistance and the thing checksums.txt
# covers; the packages are for people who expect a package manager.
#
# This reverses an earlier decision recorded in this file, which held that a stale
# package is worse than no package because users would install an old version from
# a repository instead of a checksummed release. That is still true, and it is why
# none of these are pushed anywhere:
#
#   - No distribution repository is configured. A package that exists only on the
#     release page cannot go stale in a repository, because there is no repository.
#   - Every package carries the same binary as the archive beside it.
#   - The man page names the command rather than a version, so a stale package
#     would be obvious rather than plausible.

nfpms:
  - id: lensyxe
    # amd64 only. The binary is pure and would cross-compile, but the man page and
    # the desktop entry are not architecture-specific, and shipping them for a
    # platform nobody can run the binary on only pads the download list.
    ids:
      - linux-amd64
    package_name: lensyxe
    vendor: Lensyxe
    homepage: https://github.com/zelvior/lensyxe
    maintainer: Lensyxe <maintainers@users.noreply.github.com>
    description: |
      Score the engineering health of a repository.
      Reports a 0-100 score from code complexity, dependency hygiene, and git
      history. Every figure is computed locally.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: dist/lensyxe_linux_amd64_v1/lensyxe
        dst: /usr/bin/lensyxe
      - src: dist/lensyxe-gui_linux_amd64_v1/lensyxe-gui
        dst: /usr/bin/lensyxe-gui
      - src: build/desktop/linux/lensyxe.1
        dst: /usr/share/man/man1/lensyxe.1
      - src: build/desktop/linux/lensyxe.desktop
        dst: /usr/share/applications/lensyxe.desktop
      - src: LICENSE
        dst: /usr/share/doc/lensyxe/LICENSE
      - src: README.md
        dst: /usr/share/doc/lensyxe/README.md
    deb:
      # No maintainer scripts. A postinst that rewrites PATH is how a package
      # manager ends up fighting an installer over the same file.
      # `lensyxe installer --yes` is the sanctioned way to do that, and it is
      # reversible.
      compression: gz
    rpm:
      compression: gzip
      # The binary is static and links no shared libraries. An RPM requiring a
      # dozen libraries the binary never uses would block installation on a
      # machine that already has everything it needs.

# No nsis target here. build/desktop/win/nsis.nsi is built by a Windows job on a
# Windows runner, because makensis exists nowhere else and an installer has to be
# produced on the platform it installs onto.
#
# No dmg target here either, on purpose. goreleaser's dmg builder cannot sign, and
# an unsigned disk image is blocked by Gatekeeper on current macOS, so shipping one
# would produce an artifact that looks broken rather than one that looks unsigned.
# build/desktop/mac/build.sh assembles and signs the .dmg on a macOS runner with a
# Developer ID, and degrades to a clearly-labelled unsigned image when none is
# configured.

# ------------------------------------------------------------------- sboms

# No SBOM artifact. A generated SBOM that nobody verifies adds a maintenance
# surface without changing what a consumer can actually check; the checksum plus
# the embedded commit in `lensyxe version` cover the same ground today.
