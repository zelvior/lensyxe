<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lensyxe architecture.

  The pipeline is drawn in execution order, left to right, because the order
  is load-bearing: each stage consumes the previous stage's output, and two of
  them cannot work in a different sequence. An unordered box diagram would imply
  the stages are interchangeable, which they are not.

  The dashed path under the output drivers marks the only outbound request in
  the entire project. It is drawn dashed because it is optional and inert
  without a key.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Lensyxe architecture</title>
  <desc id="arch-desc">A left-to-right pipeline: a core engine drives four analyzers
    (code, Git, dependencies, and workspace detection), which feed a metrics and risk stage,
  which drives four output drivers (CLI terminal, JSON, Markdown, and an embedded dashboard).
  A separate optional AI explanation layer can summarize findings but cannot produce a
    number, and it is the only part that makes an outbound request.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#0d1117"/>

  <text x="40" y="52" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="26" font-weight="700" fill="#e6edf3">Lensyxe architecture</text>
  <text x="40" y="78" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="14" fill="#8b949e">Left to right in execution order. Every stage is a separate Go package and independently testable.</text>

  <!-- ============================================ stage 1: core engine -->
  <g>
    <rect x="40" y="270" width="150" height="96" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="115" y="300" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#58a6ff">Core Engine</text>
    <text x="115" y="322" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8b949e">orchestration</text>
    <text x="115" y="340" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8b949e">timeout</text>
    <text x="115" y="358" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8b949e">config + flags</text>
  </g>

  <!-- Bus from the core engine into the analyzer stack. One bracket with a stub
       per analyzer, rather than four lines crossing the diagram, so the eye
       follows the flow left to right without tangles. -->
  <path d="M190 318 H222" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M222 182 V470" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M222 182 H244" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M222 278 H244" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M222 374 H244" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M222 470 H244" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================ stage 2: analyzers -->
  <text x="244" y="128" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#6e7681" letter-spacing="1">ANALYZERS</text>

  <g>
    <!-- Code -->
    <rect x="244" y="140" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="262" y="166" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#3fb950">Code</text>
    <text x="262" y="188" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">filesystem walk, LOC</text>
    <text x="262" y="206" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">language detection</text>
  </g>

  <!-- Git -->
  <g>
    <rect x="244" y="236" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="262" y="262" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#a371f7">Git</text>
    <text x="262" y="284" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">churn, cadence, authors</text>
    <text x="262" y="302" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">over a time window</text>
  </g>

  <!-- Dependencies -->
  <g>
    <rect x="244" y="332" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="262" y="358" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#d29922">Dependencies</text>
    <text x="262" y="380" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">npm, Go, Python, Cargo</text>
    <text x="262" y="398" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">manifest + lockfile drift</text>
  </g>

  <!-- Workspace -->
  <g>
    <rect x="244" y="428" width="200" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="262" y="454" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#f778ba">Workspace</text>
    <text x="262" y="476" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">monorepo detection</text>
    <text x="262" y="494" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">per-package attribution</text>
  </g>

  <!-- The no-second-pass note, because it is a deliberate design decision. -->
  <text x="244" y="536" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#6e7681">Per-package scoring re-aggregates records the walk already</text>
  <text x="244" y="552" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#6e7681">retained. No second filesystem pass.</text>

  <!-- Analyzers into scoring. The bus lands on the vertical centre of the
       scoring stack, not on any one box, because all four analyzers feed the
       stage as a group rather than a specific one. -->
  <path d="M444 182 H466" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M444 278 H466" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M444 374 H466" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M444 470 H466" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M466 182 V278" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M466 374 V278" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M466 278 H508" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================= stage 3: metrics + risk -->
  <text x="510" y="128" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#6e7681" letter-spacing="1">SCORING</text>

  <g>
    <rect x="510" y="140" width="230" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="528" y="166" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">Metrics</text>
    <text x="528" y="188" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">weighted, clamped 0–100</text>
    <text x="528" y="206" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">unmeasured metrics excluded</text>
  </g>

  <g>
    <rect x="510" y="236" width="230" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="528" y="262" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">Risk Engine</text>
    <text x="528" y="284" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">evidence, impact, severity</text>
    <text x="528" y="302" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">hotspot confirmation</text>
  </g>

  <g>
    <rect x="510" y="332" width="230" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="528" y="358" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">Gates</text>
    <text x="528" y="380" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">thresholds → exit codes</text>
    <text x="528" y="398" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#6e7681">report first, then verdict</text>
  </g>

  <!-- Scoring into the output drivers, same bracketed bus. -->
  <path d="M740 182 H762" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M740 278 H762" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M740 374 H762" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M762 182 V274" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M762 374 V274" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <path d="M762 274 H808" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================= stage 4: output drivers -->
  <text x="810" y="128" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#6e7681" letter-spacing="1">OUTPUT DRIVERS</text>

  <g>
    <rect x="810" y="140" width="160" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="890" y="172" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">CLI</text>
    <text x="890" y="194" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">terminal report</text>
  </g>

  <g>
    <rect x="990" y="140" width="160" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1070" y="172" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">JSON</text>
    <text x="1070" y="194" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">pipelines, dashboard</text>
  </g>

  <g>
    <rect x="810" y="236" width="160" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="890" y="268" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">Markdown</text>
    <text x="890" y="290" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">PR bodies, docs</text>
  </g>

  <g>
    <rect x="990" y="236" width="160" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1070" y="268" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">SQLite</text>
    <text x="1070" y="290" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">offline history</text>
  </g>

  <g>
    <rect x="810" y="332" width="340" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="980" y="364" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">Embedded Dashboard</text>
    <text x="980" y="386" text-anchor="middle" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">lensyxe serve · loopback only · read-only API</text>
  </g>

  <!-- ========================================= optional: AI explanation -->
  <text x="40" y="612" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#6e7681" letter-spacing="1">OPTIONAL — AND NOT ABLE TO PRODUCE A NUMBER</text>

  <g>
    <rect x="40" y="624" width="330" height="96" rx="10" fill="#161b22" stroke="#8b949e" stroke-dasharray="4 4"/>
    <text x="58" y="650" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#8b949e">AI Explanation (--explain)</text>
    <text x="58" y="672" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">Summarizes findings already computed.</text>
    <text x="58" y="690" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">A reply containing an unmeasured figure</text>
    <text x="58" y="708" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">is discarded, not parsed.</text>
  </g>

  <path d="M370 672 H406" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>

  <g>
    <rect x="406" y="624" width="330" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="424" y="650" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="14" font-weight="700" fill="#e6edf3">Provider (BYOK)</text>
    <text x="424" y="672" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#8b949e">OpenRouter · OpenAI · Gemini</text>
    <text x="424" y="690" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#6e7681">Key read from an env var NAME, never</text>
    <text x="424" y="708" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
          font-size="11.5" fill="#6e7681">stored in config.</text>
  </g>

  <!-- The one outbound request in the project. -->
  <text x="770" y="656" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="#f85149">THE ONLY OUTBOUND REQUEST IN THE PROJECT</text>
  <text x="770" y="678" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#8b949e">Inert without a key. Inert without --explain.</text>
  <text x="770" y="696" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#8b949e">Nothing in the pipeline above can produce a score.</text>

  <!-- footer invariant -->
  <line x1="40" y1="736" x2="1140" y2="736" stroke="#21262d"/>
  <text x="40" y="752" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#6e7681">100% Go core · CGO_ENABLED=0 · deterministic output · no required network access</text>
</svg>