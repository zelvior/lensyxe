# golangci-lint configuration.
#
# Schema: golangci-lint v2. The v1 layout (`run:`, `linters-settings:`, and a
# top-level `issues:` block) is rejected outright by v2, so a config that looks
# reasonable from v1 documentation fails to load rather than being ignored.
#
# Verified against golangci-lint 2.14.0, which is the version pinned in
# .github/workflows/ci.yml.

version: "2"

run:
  # Only the packages the Go build sees.
  #
  # `examples/` holds test fixtures, not shipped code. examples/risky-go
  # deliberately has no test files and examples/healthy-go exists to be
  # analyzable, so linting them produces noise about files that were never meant
  # to be idiomatic — and linting the generated Next.js output would be
  # meaningless.
  #
  # The embedded dashboard is generated and is likewise excluded.
  modules-download-mode: readonly

  timeout: 5m

  tests: true

  build-tags: []

linters:
  # `standard` is errcheck, govet, ineffassign, staticcheck, and unused. That is
  # the right floor: each of those catches a class of defect that is
  # inconvenient to find by reading, and none of them is a matter of taste.
  default: standard

  enable:
    # errcheck: unchecked errors. `defer f.Close()` on a read-only handle is
    # fine and needs no change; a swallowed error on a write path is a bug.
    - errcheck

    # govet: already run directly by CI, but running it here too means a
    # failure is attributed to the linter as well as to its own step.
    - govet

    # staticcheck: correctness, not style.
    - staticcheck

    # ineffassign: a value assigned and never read is usually a bug.
    - ineffassign

    # unused: dead code. In a project this size, an unused exported helper is
    # usually a feature that was half-finished.
    - unused

  settings:
    errcheck:
      # Close() on a handle whose error cannot be acted on is not a defect. This
      # is why `errcheck` without a default exclusion list produces hundreds of
      # findings on idiomatic Go, and why a project that cannot get to zero
      # stops running the linter at all.
      check-blank: false

    staticcheck:
      # The QF (quickfix) family is excluded deliberately.
      #
      # QF checks are style preferences with autofixes, not defects. Enabling
      # them turned a lint gate into a formatting migration: 78 of the 86 initial
      # findings were QF1012 alone, and `golangci-lint run --fix` then produced
      # conflicting edits because S1039 and QF1012 disagree about the same line
      # (one wants Fprintf, the other wants the Sprintf dropped). Those rewrites
      # were applied and verified byte-identical against the golden files, but
      # they belong in a style commit, not as a condition of a pull request
      # passing lint.
      #
      # What remains are the correctness checks, which is the point.
      checks:
        - all
        - -QF1001
        - -QF1003
        - -QF1008
        - -QF1011
        - -QF1012
        - -S1000
        - -S1001
        - -S1002
        - -S1011
        # ST1000-family: opinionated about package documentation and naming.
        # This codebase documents the reasoning rather than every symbol, which
        # is deliberate — a comment that restates the identifier is noise that
        # makes the comments carrying information harder to find.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

  exclusions:
    # Generated files are not ours to fix, and a report about them is a report
    # nobody can act on.
    generated: lax

    # In v2, path exclusions live here rather than under `issues.exclude-dirs`,
    # which was removed. Getting this wrong is not a soft failure: the config
    # fails to load and the linter does not run at all.
    paths:
      - dashboard/out
      - dashboard/.next
      - dashboard/node_modules
      - internal/server/assets
      # The VS Code extension is TypeScript in a nested module. Linting a
      # dependency's vendored source would report findings nobody can act on.
      - ide/vscode/node_modules
      - ide/vscode/out

    rules:
      # errcheck on deferred Close is idiomatic. A deferred Close's error cannot
      # be handled in any useful way — the function is already returning.
      - linters:
          - errcheck
        text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"

formatters:
  # gofmt and goimports are handled as a formatters block in v2, not under
  # `linters`. Keeping them here means `golangci-lint fmt` fixes them the same
  # way CI checks them, so a contributor never has to learn two commands.
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zelvior/lensyxe

  exclusions:
    generated: lax

issues:
  # Every occurrence is reported. Capping at three hides exactly the findings
  # worth seeing, because a systematic mistake produces one finding per site and
  # the first three are always the same mistake.
  #
  # Test files are not excluded. Test code that ignores an error is usually just
  # as wrong as production code that does.
  max-issues-per-linter: 0
  max-same-issues: 0